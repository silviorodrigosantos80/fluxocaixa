version: '3.9'

services:

  # -----------------------------
  # POSTGRES - LANCAMENTOS
  # -----------------------------
  postgres-lancamentos:
    image: postgres:16
    container_name: fluxocaixa-postgres-lancamentos
    restart: always
    environment:
      POSTGRES_DB: fluxocaixa_lancamentos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_lancamentos_data:/var/lib/postgresql/data
    networks:
      - fluxocaixa-network

  #------------------------------
  # POSTGRES - CONSOLIDADO
  #------------------------------
  postgres-consolidado:
    image: postgres:16
    container_name: fluxocaixa-postgres-consolidado
    restart: always
    environment:
      POSTGRES_DB: fluxocaixa_consolidado
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-consolidado-data:/var/lib/postgresql/data
    networks:
      - fluxocaixa-network

  # -----------------------------
  # POSTGRES - KEYCLOAK
  # -----------------------------
  postgres-keycloak:
    image: postgres:16
    container_name: fluxocaixa-postgres-keycloak
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - fluxocaixa-network

  # -----------------------------
  # RABBITMQ
  # -----------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fluxocaixa-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - fluxocaixa-network

  # -----------------------------
  # KEYCLOAK
  # -----------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: fluxocaixa-keycloak
    restart: always
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      - postgres-keycloak
    networks:
      - fluxocaixa-network

  # -----------------------------
  # PORTAINER
  # -----------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: fluxocaixa-portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - fluxocaixa-network

  #-----------------------------
  # API LANÇAMENTOS
  #-----------------------------
  lancamentos-api:
    build:
      context: ..
      dockerfile: src/Services/Lancamentos/FluxoCaixa.Lancamentos.Api/Dockerfile
    container_name: fluxocaixa-lancamentos-api
    restart: always
    depends_on:
      - postgres-lancamentos
      - rabbitmq
      - keycloak
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LancamentosConnection: Host=postgres-lancamentos;Port=5432;Database=fluxocaixa_lancamentos;Username=postgres;Password=postgres
      ASPNETCORE_URLS: http://+:5001
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      Authentication__Authority: http://192.168.1.3:8081/realms/fluxocaixa
      Authentication__Audience: fluxocaixa-api
      Authentication__RequireHttpsMetadata: "false"
    ports:
      - "5001:5001"
    networks:
      - fluxocaixa-network
  
  # -----------------------------
  # OUTBOX PUBLISHER - LANÇAMENTOS
  # -----------------------------
  lancamentos-outbox:
    build:
      context: ..
      dockerfile: src/Services/Lancamentos/FluxoCaixa.Lancamentos.OutboxPublisher/Dockerfile
    container_name: fluxocaixa-lancamentos-outbox
    restart: always
    depends_on:
      - postgres-lancamentos
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LancamentosConnection: Host=postgres-lancamentos;Port=5432;Database=fluxocaixa_lancamentos;Username=postgres;Password=postgres
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      Outbox__BatchSize: 100
      Outbox__DelayMilliseconds: 500
      Outbox__MaxParallelism: 8
      Outbox__MaxRetry: 5
    networks:
      - fluxocaixa-network

  #-----------------------------
  # API CONSOLIDADO
  #-----------------------------
  consolidado-api:
    build:
      context: ..
      dockerfile: src/Services/Consolidado/FluxoCaixa.Consolidado.Api/Dockerfile
    container_name: fluxocaixa-consolidado-api
    restart: always
    depends_on:
      - postgres-consolidado
      - rabbitmq
      - keycloak
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConsolidadoConnection: Host=postgres-consolidado;Port=5432;Database=fluxocaixa_consolidado;Username=postgres;Password=postgres
      ASPNETCORE_URLS: http://+:5002
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      Authentication__Authority: http://192.168.1.3:8081/realms/fluxocaixa
      Authentication__Audience: fluxocaixa-api
      Authentication__RequireHttpsMetadata: "false"
    ports:
      - "5002:5002"
    networks:
      - fluxocaixa-network
  
  #-------------------------------
  # WORKER CONSOLIDADO
  #-------------------------------
  consolidado-worker:
    build:
      context: ..
      dockerfile: src/Services/Consolidado/FluxoCaixa.Consolidado.Worker/Dockerfile
    container_name: fluxocaixa-consolidado-worker
    restart: always
    depends_on:
      - postgres-consolidado
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConsolidadoConnection: Host=postgres-consolidado;Port=5432;Database=fluxocaixa_consolidado;Username=postgres;Password=postgres
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      MassTransit__PrefetchCount: 32
      MassTransit__ConcurrentMessageLimit: 16
      MassTransit__Retry__RetryLimit: 5
      MassTransit__Retry__MinIntervalMs: 200
      MassTransit__Retry__MaxIntervalMs: 5000
      MassTransit__Retry__IntervalDeltaMs: 500
    networks:
      - fluxocaixa-network
# -----------------------------
# VOLUMES (PERSISTÊNCIA)
# -----------------------------
volumes:
  postgres_lancamentos_data:
  postgres-consolidado-data:
  postgres_keycloak_data:
  rabbitmq_data:
  portainer_data:

# -----------------------------
# NETWORK
# -----------------------------
networks:
  fluxocaixa-network:
    driver: bridge